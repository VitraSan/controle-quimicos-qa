name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unitarios-e-api:
    name: Unitários e API (Jest + Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: unitarios-e-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 14
